            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v7/Campaigns/validation/rule-set:
    get:
      tags:
      - Campaigns
      summary: Returns validation rules for a Campaign object.
      responses:
        '200':
          description: The Campaign validation rules are returned in the response body.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GetValidationDefinitionResourceModel'
            application/json:
              schema:
                $ref: '#/components/schemas/GetValidationDefinitionResourceModel'
            text/json:
              schema:
                $ref: '#/components/schemas/GetValidationDefinitionResourceModel'
  /v7/Campaigns/count:
    get:
      tags:
      - Campaigns
      summary: 'Calculates the aggregate count of campaigns partitioned by the campaign status.

        Only counts those objects which the user has been granted access.'
      parameters:
      - name: filter
        in: query
        description: Gets or Sets the filter specification strings
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: The counts operation completed successfully.
          content:
            text/plain:
              schema:
                type: object
                properties:
                  Draft:
                    type: integer
                    format: int32
                  InReview:
                    type: integer
                    format: int32
                  Scheduled:
                    type: integer
                    format: int32
                  Active:
                    type: integer
                    format: int32
                  Inactive:
                    type: integer
                    format: int32
                additionalProperties: false
            application/json:
              schema:
                type: object
                properties:
                  Draft:
                    type: integer
                    format: int32
                  InReview:
                    type: integer
                    format: int32
                  Scheduled:
                    type: integer
                    format: int32
                  Active:
                    type: integer
                    format: int32
                  Inactive:
                    type: integer
                    format: int32
                additionalProperties: false
            text/json:
              schema:
                type: object
                properties:
                  Draft:
                    type: integer
                    format: int32
                  InReview:
                    type: integer
                    format: int32
                  Scheduled:
                    type: integer
                    format: int32
                  Active:
                    type: integer
                    format: int32
                  Inactive:
                    type: integer
                    format: int32
                additionalProperties: false
        '400':
          description: The filter parameters were incorrect or invalid.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
components:
  schemas:
    GetValidationDefinitionResourceModel:
      type: object
      properties:
        typeName:
          type:
          - string
          - 'null'
        ruleSet:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/RuleDefinition'
      additionalProperties: false
      description: Get Validation Definition resource model.
    GetCampaignProjectionResourceModel:
      type: object
      properties:
        campaignProjectionId:
          type: integer
          format: int32
        campaignId:
          type: integer
          format: int32
        eventId:
          type: string
          format: uuid
      additionalProperties: false
    CampaignPricingModel:
      enum:
      - None
      - CPR
      - CPE
      - CPT
      - CPS
      - CPST
      - CPSH
      - CPM
      type: string
      description: 'Campaign PricingModel enumeration.

        This must be kept in step with Cardlytics.Api.CampaignBuild.Repository.Entities.CampaignPricingModel.'
    Operation:
      type: object
      properties:
        value: {}
        path:
          type:
          - string
          - 'null'
        op:
          type:
          - string
          - 'null'
        from:
          type:
          - string
          - 'null'
      additionalProperties: false
    RuleDefinition:
      type: object
      properties:
        propertyName:
          type:
          - string
          - 'null'
        ruleType:
          $ref: '#/components/schemas/RuleTypes'
        valueType:
          type:
          - string
          - 'null'
        errorMessage:
          type:
          - string
          - 'null'
      additionalProperties: false
    GetValidationResourceModel:
      type: object
      properties:
        isValid:
          default: false
        errors:
          type:
          - object
          - 'null'
          additionalProperties:
            type: array
            items:
              type: string
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
      description: Get Validation endpoint resource model.
    CampaignObjective:
      enum:
      - DriveSales
      - BuildLoyalty
      - AcquireNewCustomers
      type: string
    GetCampaignVersionResourceModel:
      type: object
      properties:
        version:
          type: integer
          format: int32
        eventDateTime:
          type: string
          format: date-time
          example: '1987-03-18T00:00:00.0000000-08:00'
      additionalProperties: false
    CampaignType:
      enum:
      - FIXED_CLO
      - DYNAMIC_CLO
      type: string
      description: CampaignType enumeration.
    ScheduleType:
      enum:
      - Lifetime
      - Daily
      type: string
      description: 'Schedule Type enumeration.

        This must be kept in step with Cardlytics.Api.CampaignBuild.Repository.Entities.ScheduleType.'
    PutCampaignStatusResourceModel:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/CampaignStatus'
      additionalProperties: false
    GetCampaignResourceModel:
      type: object
      properties:
        startDateTime:
          description: This value is processed at the local time relative to the client at point of redemption, therefore a timezone is not specified.
          example: '1987-03-18T00:00:00.0000000'
        endDateTime:
          description: This value is processed at the local time relative to the client at point of redemption, therefore a timezone is not specified.
          example: '1987-03-18T00:00:00.0000000'
        createDateTime:
          type: string
          format: date-time
          example: '1987-03-18T00:00:00.0000000-08:00'
        updateDateTime:
          type: string
          format: date-time
          example: '1987-03-18T00:00:00.0000000-08:00'
        transactionDateTime:
          type: string
          format: date-time
          example: '1987-03-18T00:00:00.0000000-08:00'
        targetRoas:
          type:
          - number
          - 'null'
          format: double
        isOfferAutoActivated:
          default: false
        campaignType:
          $ref: '#/components/schemas/CampaignType'
        attributionWindow:
          type:
          - integer
          - 'null'
          format: int32
        isBankFunded:
          default: false
        currency:
          $ref: '#/components/schemas/Currency'
        campaignPricingModel:
          $ref: '#/components/schemas/CampaignPricingModel'
        orderNumber:
          type:
          - string
          - 'null'
        campaignId:
          type: integer
          format: int32
        name:
          type:
          - string
          - 'null'
        accountId:
          type:
          - string
          - 'null'
        campaignObjective:
          $ref: '#/components/schemas/CampaignObjective'
        budget:
          type: number
          format: double
        scheduleType:
          $ref: '#/components/schemas/ScheduleType'
        campaignStatus:
          $ref: '#/components/schemas/CampaignStatus'
        createUser:
          type:
          - string
          - 'null'
        updateUser:
          type:
          - string
          - 'null'
      additionalProperties: false
    PostCampaignResourceModel:
      required:
      - budget
      - campaignObjective
      - campaignPricingModel
      - name
      - orderNumber
      - scheduleType
      type: object
      properties:
        startDateTime:
          description: 'This value is processed at the local time relative to the client at point of redemption, therefore a timezone is not specified.

            This value must be a valid ISO DateTime.'
          example: '1987-03-18T00:00:00.0000000'
        endDateTime:
          description: 'This value is processed at the local time relative to the client at point of redemption, therefore a timezone is not specified.

            This value must be a valid ISO DateTime.'
          example: '1987-03-18T00:00:00.0000000'
        transactionDateTime:
          type:
          - string
          - 'null'
          format: date-time
          example: '1987-03-18T00:00:00.0000000-08:00'
        targetRoas:
          type:
          - number
          - 'null'
          format: double
        isOfferAutoActivated:
          default: false
        campaignType:
          $ref: '#/components/schemas/CampaignType'
        attributionWindow:
          type:
          - integer
          - 'null'
          format: int32
        isBankFunded:
          default: false
        campaignPricingModel:
          $ref: '#/components/schemas/CampaignPricingModel'
        currency:
          $ref: '#/components/schemas/Currency'
        orderNumber:
          minLength: 1
          type: string
        name:
          minLength: 1
          type: string
        campaignObjective:
          $ref: '#/components/schemas/CampaignObjective'
        budget:
          type: number
          format: double
        scheduleType:
          $ref: '#/components/schemas/ScheduleType'
      additionalProperties: false
    ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        instance:
          type:
          - string
          - 'null'
      additionalProperties: {}
    Currency:
      enum:
      - USD
      - GBP
      type: string
    CampaignStatus:
      enum:
      - Draft
      - Pending
      - InReview
      - Scheduled
      - Active
      - Inactive
      type: string
      description: Campaign status enumeration.
    RuleTypes:
      enum:
      - Required
      - GreaterThan
      - GreaterThanOrEqualTo
      - LessThan
      - Length
      - Enum
      - EnumNotDefaulted
      - InclusiveBetween
      - ExclusiveBetween
      - NotEqual
      - UniqueCollection
      type: string
      description: Validation rule definition types.
  securitySchemes:
    oauth2-cognito:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://advertiser-auth-preprod.auth.us-east-1.amazoncognito.com/oauth2/authorize
          tokenUrl: https://advertiser-auth-preprod.auth.us-east-1.amazoncognito.com/oauth2/token
          scopes:
            openid: openid
      x-tokenName: id_token
