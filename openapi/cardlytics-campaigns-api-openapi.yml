openapi: 3.2.0
info:
  title: Campaign Build Campaigns API
  version: latest
servers:
- url: https://api.cardlytics.com
  description: Base URL declared by the provider in apis.yml (roadmap#122).
security:
- oauth2-cognito:
  - read
tags:
- name: Campaigns
paths:
  /v7/accounts/{accountId}/Campaigns:
    get:
      tags:
      - Campaigns
      summary: Returns all Campaigns from the repository for a given account.
      parameters:
      - name: accountId
        in: path
        description: The accountId to for which to retrieve Campaigns.
        required: true
        schema:
          type: string
      - name: PerPage
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: Page
        in: query
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: OrderBy
        in: query
        schema:
          type: string
      - name: filter
        in: query
        description: Gets or Sets the filter specification strings
        schema:
          type: array
          items:
            type: string
      responses:
        '200':
          description: The list of Campaign was found and returned in the response body.
          content:
            text/plain:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetCampaignResourceModel'
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetCampaignResourceModel'
            text/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetCampaignResourceModel'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Not Found
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
    post:
      tags:
      - Campaigns
      summary: Adds a Campaign to the repository.
      parameters:
      - name: accountId
        in: path
        description: The accountId of the user to filter the request.
        required: true
        schema:
          type: string
      requestBody:
        description: The Campaign to add to the repository.
        content:
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/PostCampaignResourceModel'
          application/json:
            schema:
              $ref: '#/components/schemas/PostCampaignResourceModel'
          text/json:
            schema:
              $ref: '#/components/schemas/PostCampaignResourceModel'
          application/*+json:
            schema:
              $ref: '#/components/schemas/PostCampaignResourceModel'
      responses:
        '201':
          description: The Campaign was created; the response contains the new entity and the route to retrieve it from this controller.
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/GetCampaignResourceModel'
            application/json:
              schema:
                $ref: '#/components/schemas/GetCampaignResourceModel'
            text/json:
              schema:
                $ref: '#/components/schemas/GetCampaignResourceModel'
        '403':
          description: Forbidden
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
            text/json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
  /v7/Campaigns:
    get:
