        required: true
        schema:
          type: integer
          format: int32
      - name: duplicates
        in: query
        description: Count of duplicates.
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
          default: 1
      responses:
        '303':
          description: The Campaign was duplicated and the GET route to the new duplicated campaign is returned in the location header.
