notes:
- The Campaign Build API splits every entity into Get/Post/Put resource models rather than sharing one schema, so the read and write shapes of the same object are separate types.
- ProblemDetails is declared in the Campaign Build components but is not referenced by any response — the 4xx responses attach no schema at all.
- The publisher Ad schema carries no identifier field, so a client cannot correlate an ad returned by getAds with the adId used in Redemption without an out-of-band mapping.
- The Partner API is the only surface that keys objects on partner-supplied external ids, which is what makes its PUT operations upsertable.
