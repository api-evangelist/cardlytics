summary: >-
  Derived from schema $ref links and id-reference fields across the three
  published OpenAPI documents (101 schemas total). Cardlytics runs three
  disjoint object models over one data core: an advertiser campaign hierarchy
  (Account > Campaign > AdGroup > Ad > Reward), a publisher consumer model
  (Institution/Portfolio > Customer > Account > Card, plus Ad and Redemption),
  and a thin partner ingestion model (Merchant > Offer). The two ends never
  share an identifier in the public specs — an Ad in the advertiser model has an
  adId, and the publisher Ad schema declares no id field at all — so the
  advertiser-to-consumer join is internal and not exposed.
