aid: cardlytics
name: Cardlytics
description: >-
  Cardlytics is a commerce media platform that uses first-party purchase data
  from its financial-institution partners to help advertisers reach consumers
  inside banking apps with card-linked offers and measurable, closed-loop
  attribution. Advertisers plan, launch, and measure card-linked campaigns
  through Ads Manager and advertiser APIs, while banks and neobanks (publishers)
  embed Merchant Offers and the Cardlytics Rewards Platform into their digital
  channels via publisher APIs and SDKs. The company also operates the Dosh
  card-linked network and the Bridg offline purchase-intelligence business,
  giving advertisers person-level measurement across online and in-store spend.
  Cardlytics publishes three OpenAPI 3.0.1 definitions through its ReadMe
  developer hub — a Partner API for advertiser merchant and offer ingestion,
  reporting and a daily redemption feed; a Campaign Build API covering the Ads
  Manager campaign object model; and a Publisher API v2 for the bank-side
  rewards experience — alongside iOS, Android and web SDKs. Nothing is
  self-service: every credential is issued by an account manager under a partner
  agreement, and the API hosts answer 403 to anonymous callers. Cardlytics is a
  public company (NASDAQ: CDLX) and its platform is an enterprise,
  partnership-based product rather than a self-service developer API.
