apis:
- name: Cardlytics Partner API
  description: >-
    The advertiser-partner integration surface. Partners upsert and delete
    merchants and offers keyed on their own external identifiers, pull aggregate
    merchant/offer performance metrics (impressions, purchases, revenue, reach,
    activations), and fetch a pre-signed URL for the daily redemption feed.
    OAuth 2.0 client credentials; 7 operations across 5 paths.
  humanURL: https://platform.cardlytics.com/advertisers/reference
  baseURL: https://api.cardlytics.com
  tags:
  - Advertising
  - Offers
  - Merchants
  - Reporting
  properties:
  - type: OpenAPI
    url: openapi/cardlytics-partner-api-openapi.yml
  - type: OpenAPI
    url: openapi/_original/cardlytics-partner-api-openapi.json
  - type: Overlay
    url: overlays/cardlytics-partner-api-overlay.yaml
  - type: Documentation
    url: https://platform.cardlytics.com/advertisers/docs/api-get-started
  - type: APIReference
    url: https://platform.cardlytics.com/advertisers/reference
  - type: GettingStarted
    url: https://platform.cardlytics.com/advertisers/docs/api-get-started
  - type: Sandbox
    url: https://api-sandbox.cardlytics.com
  - type: ChangeLog
    url: https://platform.cardlytics.com/advertisers/changelog
- name: Cardlytics Campaign Build API
  description: >-
    The Ads Manager campaign object model — Campaigns, AdGroups, Ads, Audiences,
    AudienceReach, Rewards, PricingModels, RedeemingMerchants, Geo, PurchaseCategories,
    AuditLogs and per-entity validation rule sets. 74 operations across 57 paths,
    versioned per resource from v5 to v8, secured with an OAuth 2.0 authorization
    code flow against an Amazon Cognito user pool.
  humanURL: https://platform.cardlytics.com/advertisers
  baseURL: https://api.cardlytics.com
  tags:
  - Advertising
  - Campaigns
  - Audiences
  - Ads
  properties:
  - type: OpenAPI
    url: openapi/cardlytics-campaign-build-api-openapi.yml
  - type: OpenAPI
    url: openapi/_original/cardlytics-campaign-build-api-openapi.json
  - type: Overlay
    url: overlays/cardlytics-campaign-build-api-overlay.yaml
  - type: Documentation
    url: https://platform.cardlytics.com/advertisers
  - type: APIReference
    url: https://platform.cardlytics.com/advertisers/reference
  x-note: >-
    The published specification declares no servers[] block, so the host is not
    named in the contract. baseURL records the production Cardlytics API host
    named in the sibling Partner API specification and the advertiser docs; the
    Campaign Build spec's only host reference is a PRE-PRODUCTION Amazon Cognito
    authorization server (advertiser-auth-preprod), which Cardlytics should
    replace with the production authorization server and a real servers[] block.
- name: Cardlytics Publisher API v2
  description: >-
    The bank-side rewards platform API. A publisher opens an institution- or
    customer-scoped session, retrieves ranked targeted card-linked offers for a
    customer, and reads that customer's profile, reward summary and redemption
    history. Requires mutual TLS with a Cardlytics-signed client certificate plus
    an IP allow list, then an X-CDLX-Session-Token header.
  humanURL: https://platform.cardlytics.com/publisher-integrations
  baseURL: https://pub-api-us.prod.cardlytics.com
  tags:
  - Banking
  - Rewards
  - Offers
  - Financial-Services
