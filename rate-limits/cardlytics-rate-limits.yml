limit_count: 0
note: >-
  Cardlytics documents that rate limits EXIST and that exceeding them returns
  429, but publishes no numeric limit any caller can rely on. Partner API quotas
  ("a daily quota of the number of calls" and "an RPS, for example, 10 calls per
  second") are provisioned per partner in the partner agreement — the "10 calls
  per second" in the docs is explicitly an example, not a published ceiling, so
  it is not recorded as a limit here. On the Publisher API the provider states
  the opposite posture: "Cardlytics imposes no general rules around throttling
  incoming requests" and "tries to never respond with this response code".
  limit_count is therefore 0: an honest zero, not an unchecked field.
