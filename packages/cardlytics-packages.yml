release_history_source: https://docs.cardlytics.com/poweredby/mobile-sdk-releases.html
release_history_note: >-
  The Powered By Cardlytics mobile SDK release notes run from 2.6.0 to 3.0.7,
  latest entry 2024-09-25 (Android) / 2024-04-30 (iOS). The separate Unified SDK
  release page lists only "Release 1.0 — Initial release of iOS, Android, and
  Web Unified SDKs" with no date. On both counts the newest first-party client
  release predates the Partner API it would sit alongside (spec version
  2025-10-07) by roughly a year.
