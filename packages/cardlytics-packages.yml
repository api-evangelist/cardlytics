summary: >-
  Cardlytics ships first-party mobile (iOS, Android) and web SDKs for the
  Powered by Cardlytics / Unified rewards experience. NONE of them is published
  to a public package registry — there is no npm, PyPI, Maven Central, NuGet,
  RubyGems, Packagist, crates.io or pkg.go.dev entry, and the GitHub
  organization github.com/cardlytics returns 404. Distribution runs through
  Cardlytics-controlled hosts, and every one of those hosts is now dead or
  redirected, so the published install instructions cannot be followed by a
  reader today. There is no server-side SDK in any language for the Partner,
  Publisher or Campaign Build REST APIs.
registry_probes:
- {registry: npm, query: 'cdlx, cardlytics, @cardlytics/sdk', result: 404 — not published}
- {registry: cocoapods-trunk, query: PoweredByCDLX, result: 404 — "No pod found with the specified name"}
- {registry: github, query: 'orgs/cardlytics, cardlytics/powered-by-cdlx-ios-releases', result: 404 — no public org or repo}
- {registry: jfrog-artifactory, query: 'https://cdlx.jfrog.io/cdlx/libs/com/cdlx/poweredby/maven-metadata.xml', result: '302 to the JFrog marketing landing page — the instance no longer serves the repository'}
- {registry: cdn, query: 'https://poweredby-sdk-release.cdlx.com/ios/PoweredByCDLX-Carthage.json', result: NXDOMAIN — the host does not resolve}
